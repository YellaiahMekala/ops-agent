# ops-alertmanager: one route, one receiver, the ops-agent webhook. Nothing else is notified from here.
# The bearer token is read from a file mounted by compose; it is never written in this file.
route:
  receiver: ops-agent
  group_by: [alertname]
  group_wait: 5s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: ops-agent
    webhook_configs:
      - url: http://ops-agent:8095/alerts
        send_resolved: true
        max_alerts: 20
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/webhook-token
