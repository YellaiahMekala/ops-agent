name: ci
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # The live OpenAI test is excluded by default (it.excludedGroups=openai) and no key is available here.
      - run: ./mvnw -B -ntp verify
      - name: Image builds
        run: docker build -t ops-agent:ci .
